spring:
  flyway:
    url: "jdbc:postgresql://${R2DBC_HOST}:${R2DBC_PORT}/${R2DBC_DATABASE}"
    user: "${R2DBC_USERNAME}"
    password: "${R2DBC_PASSWORD}"
    default-schema: "${R2DBC_SCHEMA}"
    locations: classpath:db/migration

aws:
  region: "${AWS_REGION}"
  rds:
    postgres:
      secretName: "${AWS_RDS_POSTGRES_SECRET_NAME}"
  jwt:
    secretName: "${AWS_JWT_SECRET_NAME}"
  sqs:
    sender:
      secretName: "${AWS_SQS_SENDER_SECRET_NAME}"
    listener:
      secretName: "${AWS_SQS_LISTENER_SECRET_NAME}"

adapters:
  rest-consumer:
    timeout: 5000
    url: "${AUTH_MICROSERVICE_URL}"

logging:
  level:
    org.springframework.r2dbc.core.DefaultDatabaseClient: DEBUG
    org.springframework.transaction.interceptor: DEBUG
    org.springframework.transaction.reactive: DEBUG
    org.springframework.transaction: DEBUG
    io.r2dbc.h2: DEBUG
