spring:
  r2dbc:
    url: jdbc:postgresql://${R2DBC_HOST}:${R2DBC_PORT}/${R2DBC_DATABASE}
    username: ${R2DBC_USERNAME}
    password: ${R2DBC_PASSWORD}
    properties:
      schema: ${R2DBC_SCHEMA}

  flyway:
    url: jdbc:postgresql://${R2DBC_HOST}:${R2DBC_PORT}/${R2DBC_DATABASE}
    user: ${R2DBC_USERNAME}
    password: ${R2DBC_PASSWORD}
    default-schema: ${R2DBC_SCHEMA}

adapters:
  rest-consumer:
    timeout: 5000
    url: ${AUTH_MICROSERVICE_URL}

application:
  security:
    jwt:
      expiration: 1800000
      secret-key: ${JWT_SECRET_KEY}

logging:
  level:
    root: WARN